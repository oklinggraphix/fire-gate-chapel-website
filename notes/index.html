<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fire Gate Chapel International – Sermon Notes & Quotes</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f4f7fc;--card:#fff;--text:#12203a;--muted:#5b6b86;--blue:#1b3a7a;--gold:#f2b705;--line:#dbe3f0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1426;--card:#142040;--text:#eef2fb;--muted:#9fb0cf;--blue:#8fb0ff;--gold:#f2b705;--line:#243459}}
:root[data-theme="dark"]{--bg:#0b1426;--card:#142040;--text:#eef2fb;--muted:#9fb0cf;--blue:#8fb0ff;--gold:#f2b705;--line:#243459}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.55}
header{background:linear-gradient(160deg,#10285c,#1b3a7a);color:#fff;text-align:center;padding:32px 20px 40px;border-bottom:4px solid var(--gold)}
header img{width:104px;height:104px;border-radius:50%;border:3px solid var(--gold);background:#fff;display:block;margin:0 auto}
.quote .who{display:flex;align-items:center;gap:10px}
.quote .who img{width:44px;height:44px;border-radius:50%;object-fit:cover;object-position:center top;border:2px solid var(--gold)}
header h1{margin:12px 0 2px;font-size:22px;letter-spacing:.5px}
header p{margin:0;opacity:.85;font-size:14px}
.tabs{display:flex;max-width:640px;margin:-20px auto 0;padding:0 16px;gap:8px}
.tabs button{flex:1;padding:12px;border:1px solid var(--line);background:var(--card);color:var(--muted);font-weight:600;font-size:15px;border-radius:12px;cursor:pointer}
.tabs button.on{background:var(--gold);color:#12203a;border-color:var(--gold)}
main{max-width:640px;margin:16px auto 0;padding:0 16px 32px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
.card h2{margin:0 0 2px;font-size:18px;color:var(--blue)}
.meta{font-size:13px;color:var(--muted);margin-bottom:10px}
.verse{font-size:13px;font-weight:600;color:var(--blue);margin-bottom:8px}
.card ul{margin:0;padding-left:20px}
.card li{margin-bottom:6px}
.quote{border-left:4px solid var(--gold)}
.quote p{margin:0 0 8px;font-size:17px;font-style:italic}
.quote span{font-size:13px;color:var(--muted)}
.hidden{display:none}
footer{text-align:center;font-size:13px;color:var(--muted);padding:0 16px 28px}
footer b{color:var(--blue)}
.contact{text-align:center;font-size:14px;color:var(--muted);padding:8px 16px 28px}
.contact a{display:inline-block;margin:4px;padding:10px 16px;border-radius:999px;background:var(--blue);color:#fff;text-decoration:none;font-weight:600}
:root[data-theme="dark"] .contact a,:root:not([data-theme="light"]) .contact a{color:#0b1426}
.contact a.wa{background:#1fa855;color:#fff}
</style>
</head>

var NOTES=[
 {title:"Calling & Purpose",date:"",by:"Rev. Dr. Godwin Ahiahornu",verse:"Ephesians 2:10 · John 15:8 · John 15:16 · Romans 12:8 · 1 Corinthians 15:10",
  points:["Purpose answers “Why was I created?” Calling answers “What specific assignment has God given me?” Purpose is the why; calling is the what.",
  "Every believer shares one purpose: to know God, love Him, glorify Him, reflect His character and advance His Kingdom.",
  "Your career is what you do; your purpose is why you do it. Your work can become a platform for your purpose.",
  "Callings differ: Moses was called to lead, David to be king, Paul to the Gentiles, Apollos to teach. Same Kingdom, different assignments.",
  "Calling means being chosen and sent. You represent the One who sent you, not yourself.",
  "God gives grace for the assignment. Do not measure your life by someone else’s calling.",
  "Giving can be a calling too. Those who give generously make the work of the Kingdom possible.",
  "Do not abandon your calling or copy another person’s journey. David could not fight in Saul’s armour.",
  "Every season counts: preparation, sacrifice, training, hidden seasons and visible ones.",
  "Discover your purpose. Discern your calling. Develop your gifts. Fulfil your assignment."]},
 {title:"Responsibility Is Inescapable",date:"Aug 10, 2026",by:"Rev. Dr. Godwin Ahiahornu",verse:"",
  points:["No one can take responsibility for your life. If you refuse to, someone else may start making decisions for you.",
  "A responsible person keeps promises, finishes tasks on time and does not keep making excuses. Procrastination blocks progress.",
  "Faith is not doing nothing. Do what is within your power and trust God for what is beyond it.",
  "Responsibility applies everywhere: at home, school, work, in relationships and in your personal life.",
  "Admit your mistakes and accept correction. It shows you are willing to grow.",
  "Every choice has a consequence. Do not make permanent decisions based on temporary emotions.",
  "When people use you, take note, learn and become wiser. Do not let it destroy you.",
  "Responsibility builds trust: do what you said, admit mistakes, learn from correction, honour commitments.",
  "Do not blame life, learn from it. Ask “What is my responsibility here?”",
  "Responsibility is not a punishment. It is a pathway to maturity, trust and lasting success."]}
];
var QUOTES=[
 {text:"You were not created accidentally. Your life has divine significance.",by:"Rev. Dr. Godwin Ahiahornu"},
 {text:"Your career is what you do. Your purpose is why you do it.",by:"Rev. Dr. Godwin Ahiahornu"},
 {text:"God does not call everyone to do the same thing, but He calls everyone to live for His glory.",by:"Rev. Dr. Godwin Ahiahornu"},
 {text:"Never measure your life by somebody else’s assignment.",by:"Rev. Dr. Godwin Ahiahornu"},
 {text:"Calling involves both being chosen and being sent.",by:"Rev. Dr. Godwin Ahiahornu"},
 {text:"The question is not, “What is everyone else doing?” The question is, “Lord, what have You called me to do?”",by:"Rev. Dr. Godwin Ahiahornu"},
 {text:"Your purpose is bigger than your profession. Your calling is bigger than your title. Your assignment is bigger than your position.",by:"Rev. Dr. Godwin Ahiahornu"},
 {text:"Find your purpose. Answer your calling. Glorify God with your life.",by:"Rev. Dr. Godwin Ahiahornu"},
 {text:"No one can take responsibility for your life. You must learn to take responsibility for yourself.",by:"Rev. Dr. Godwin Ahiahornu"},
 {text:"Faith does not mean doing nothing. You must be willing to move, act, and do what is within your power while trusting God for what is beyond your power.",by:"Rev. Dr. Godwin Ahiahornu"},
 {text:"Do not make permanent decisions based on temporary emotions.",by:"Rev. Dr. Godwin Ahiahornu"},
 {text:"Accepting correction does not make you weak. It shows that you are willing to grow.",by:"Rev. Dr. Godwin Ahiahornu"},
 {text:"You cannot change yesterday, but you can learn from it.",by:"Rev. Dr. Godwin Ahiahornu"},
 {text:"Responsibility is not a punishment; it is a pathway to maturity, growth, trust, leadership, and lasting success.",by:"Rev. Dr. Godwin Ahiahornu"},
 {text:"Responsibility today makes a better tomorrow.",by:"Rev. Dr. Godwin Ahiahornu"},
 {text:"For we are His workmanship, created in Christ Jesus for good works, which God prepared beforehand that we should walk in them.",by:"Ephesians 2:10",ref:true}

function esc(s){var d=document.createElement("div");d.textContent=s;return d.innerHTML}
document.getElementById("notes").innerHTML=NOTES.map(function(n){
 return '<div class="card"><h2>'+esc(n.title)+'</h2><div class="meta">'+esc(n.by)+(n.date?' · '+esc(n.date):'')+'</div><div class="verse">'+esc(n.verse)+'</div><ul>'+n.points.map(function(p){return '<li>'+esc(p)+'</li>'}).join("")+'</ul></div>'}).join("");
document.getElementById("quotes").innerHTML=QUOTES.map(function(q){
 return '<div class="card quote"><p>“'+esc(q.text)+'”</p><div class="who">'+(q.ref?'':'<img alt="" src="data:image/jpeg;base64,'+PIC+'">')+'<span>— '+esc(q.by)+'</span></div></div>'}).join("");
function show(w){
 document.getElementById("notes").classList.toggle("hidden",w!=="notes");
 document.getElementById("quotes").classList.toggle("hidden",w!=="quotes");
 document.getElementById("t1").classList.toggle("on",w==="notes");
 document.getElementById("t2").classList.toggle("on",w==="quotes");
}
</script>
